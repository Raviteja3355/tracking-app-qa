server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Root and bare /tracking both redirect to canonical /tracking/
    location = / {
        return 301 /tracking/;
    }

    location = /tracking {
        return 301 /tracking/;
    }

    # English tracking page — serve index.html from the tracking/ directory
    location /tracking/ {
        try_files $uri $uri/ /tracking/index.html /tracking.html =404;
    }

    # French bare path redirect
    location = /fr/suivi {
        return 301 /fr/suivi/;
    }

    # French tracking page
    location /fr/suivi/ {
        try_files $uri $uri/ /fr/suivi/index.html =404;
    }

    # Next.js static assets — long cache, immutable
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — never cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
