server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location = / {
        return 301 /tracking/;
    }

    location = /tracking {
        return 301 /tracking/;
    }

    location /tracking/ {
        # Do NOT use $uri/ — nginx returns 403 when it finds the tracking/
        # directory but has no index.html to serve from it.
        # Fall through: exact file → index.html in dir → top-level html → 404
        try_files $uri /tracking/index.html /tracking.html =404;
    }

    location = /fr/suivi {
        return 301 /fr/suivi/;
    }

    location /fr/suivi/ {
        try_files $uri /fr/suivi/index.html /fr/suivi.html =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
