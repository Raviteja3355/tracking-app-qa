# =============================================================================
# Default values — override per environment with values-qa.yaml / values-prod.yaml.
# Dynamic values (image.tag, targetGroupBinding.arn) are passed via --set in CI.
# =============================================================================

# -- Workload
replicaCount: 3

image:
  repository: tracking-app
  tag: placeholder
  pullPolicy: IfNotPresent

# -- Namespace created by this chart
namespace:
  create: true
  name: tracking-app

# -- Service
service:
  type: ClusterIP
  port: 80

# -- Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Pod-level security context (nginx user uid/gid = 101)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

# -- Container-level security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# -- Health probes (nginx exposes /health → 200 OK)
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

terminationGracePeriodSeconds: 30

# -- Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# -- AWS ALB TargetGroupBinding (ARN injected at deploy time via --set)
targetGroupBinding:
  enabled: true
  arn: ""

# -- API endpoints written into the runtime ConfigMap (envsubst fills config.js)
config:
  deliveryApiDomain: ""
  dispatchApiDomain: ""
  driverAppDomainCa: ""
  driverAppDomainUs: ""

# -- Applied as a label (env: qa | prod) to all resources
env: ""
