# =============================================================================
# Production environment overrides
# Dynamic values supplied at deploy time:
#   --set image.tag=<SHA7>
#   --set targetGroupBinding.arn=<TG_ARN from terragrunt output>
# =============================================================================

namespace:
  name: tracking-app-prod
  create: false

image:
  # Repository is overridden at deploy time via --set image.repository in the pipeline.
  # Fallback value — replace PROD_ACCOUNT_ID once prod AWS account is confirmed.
  repository: PROD_ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/uniuni-prod-tracking-app

# Scale higher in prod
hpa:
  minReplicas: 3
  maxReplicas: 20

# Production API endpoints
config:
  deliveryApiDomain: "https://delivery-api.uniuni.ca"
  dispatchApiDomain: "https://dispatch-api.uniuni.ca"
  driverAppDomainCa: "https://delivery-service-api.uniuni.ca"
  driverAppDomainUs: "https://delivery-service-api.uniuni.com"

env: prod
