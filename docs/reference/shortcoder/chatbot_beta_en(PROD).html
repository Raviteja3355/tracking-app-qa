  let customerAvatar = customerAvatarEn;

  const loadingDot =
    '<svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg"><circle id="Ellipse 955" cx="4" cy="4" r="4" fill="#999999"/></svg>';
  // 	const endDivider = '<div><hr class="hr-text gradient" data-content="Above are the history chat."></div>';
  const endDivider = '<div><hr class="line"></div>';

  let language = sessionStorage.getItem("language") || "en";
  jQuery("#input-language").val(language);

  var chatRecord = "";
  var name = "";
  var homeType = "";

  const validDuration = 3 * 60 * 1000; // 3 minutes
  var timeout;

  let labelLength = 0;

  let timestamp;

  var inputBox = document.getElementById("chat-send-input");
  if (inputBox) {
    inputBox.addEventListener("click", function () {
      jQuery("#chat-list").animate(
        {
          scrollTop: jQuery("#chat-list").prop("scrollHeight"),
        },
        500,
      );
    });
    inputBox.addEventListener("focus", function () {
      jQuery("#chat-list").animate(
        {
          scrollTop: jQuery("#chat-list").prop("scrollHeight"),
        },
        500,
      );
    });
  }

  jQuery(function () {
    jQuery("#input-language").change(function () {
      language = jQuery("#input-language").val();
      sessionStorage.setItem("language", language);
      startChat(true, false, true);
    });
  });

  var customerInput = document.getElementById("chat-send-input");
  customerInput.addEventListener("keypress", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      handleSend(true);
    }
  });

  document
    .getElementById("chat-input-state")
    .addEventListener("change", function () {
      const province = document.getElementById("chat-input-state").value;
      for (const country in warehouses) {
        const stateList = warehouses[country];
        for (const state in stateList) {
          if (province === state) {
            jQuery("#chat-input-country").prop("value", country);
          }
          // 				if(stateList[state].includes(city)) {
          // 					jQuery('#chat-input-state').prop('value', state);
          // 					jQuery('#chat-input-country').prop('value', country);
          // 				}
        }
      }
    });

  let elementsArray = [
    document.getElementById("chat-input-street-number"),
    document.getElementById("chat-input-street-name"),
    document.getElementById("chat-input-city"),
    document.getElementById("chat-input-state"),
    document.getElementById("chat-input-zip"),
    document.getElementById("chat-input-country"),
    document.getElementById("chat-input-unit-number"),
  ];
  elementsArray.forEach(function (elem) {
    elem.addEventListener("input", function () {
      if (
        document.getElementById("chat-input-street-number").value &&
        document.getElementById("chat-input-street-name").value &&
        document.getElementById("chat-input-city").value &&
        document.getElementById("chat-input-state").value &&
        document.getElementById("chat-input-zip").value &&
        document.getElementById("chat-input-country").value
      ) {
        if (homeType === "House") {
          jQuery("#chat-send-button-disabled").prop("disabled", false);
        } else {
          if (document.getElementById("chat-input-unit-number").value) {
            jQuery("#chat-send-button-disabled").prop("disabled", false);
          } else {
            jQuery("#chat-send-button-disabled").prop("disabled", true);
          }
        }
      } else {
        jQuery("#chat-send-button-disabled").prop("disabled", true);
      }
    });
  });

  function enableInputCancel() {
    handleSend(true, "addr", true);
  }

  function scrollToEnd() {
    jQuery("#chat-list").animate(
      {
        scrollTop: jQuery("#chat-list").prop("scrollHeight"),
      },
      500,
    );
  }

  function handleAddressFormat() {
    let customerTemplate =
      "<div class='customer-group' id={index}><div class=customer-avatar>{avatar}</div><div class='customer-text'>{text}</div></div>";
    let text =
      document.getElementById("chat-input-street-number").value +
      " " +
      document.getElementById("chat-input-street-name").value +
      "<br>" +
      document.getElementById("chat-input-city").value +
      ", " +
      document.getElementById("chat-input-state").value +
      "<br>" +
      document.getElementById("chat-input-zip").value +
      ", " +
      document.getElementById("chat-input-country").value;
    if (document.getElementById("chat-input-unit-number").value) {
      text =
        document.getElementById("chat-input-unit-number").value + " - " + text;
    }
    if (document.getElementById("chat-input-buzzer").value) {
      text +=
        "<br>" +
        "Buzzer# " +
        document.getElementById("chat-input-buzzer").value;
    }
    customerTemplate = customerTemplate
      .replace("{text}", text)
      .replace("{avatar}", customerAvatar);
    chatRecord += customerTemplate;

    jQuery("#chat-list").html(chatRecord);
    scrollToEnd();
    const compressedChatRecord = LZString.compress(chatRecord);
    sessionStorage.setItem("record", compressedChatRecord);

    enableInput();

    handleSend(true, "addr");
  }

  function handleSend(isIntent, intent, isCancel) {
    clearTimeout(timeout);

    let inputText = document.getElementById("chat-send-input").value;
    if (!isIntent) {
      inputText = intent;
    }
    if (intent === "addr") {
      enableInput();
      var obj = "NO";
      if (!isCancel) {
        obj = {
          new_address: {
            street_number: document.getElementById("chat-input-street-number")
              .value,
            street_name: document.getElementById("chat-input-street-name")
              .value,
            city: document.getElementById("chat-input-city").value,
            state_or_province:
              document.getElementById("chat-input-state").value,
            zip_code: document.getElementById("chat-input-zip").value,
            country: document.getElementById("chat-input-country").value,
            unit_number: document.getElementById("chat-input-unit-number")
              .value,
            buzzer_code: document.getElementById("chat-input-buzzer").value,
            house_type: homeType,
          },
        };
        inputText = JSON.stringify(obj);
      } else {
        inputText = obj;
        let template =
          "<div class='customer-group' id={index}><div class=customer-avatar>{avatar}</div><div class='customer-text'>{text}</div></div>";
        if (language === "fr") {
          template = template
            .replace("{text}", "Annuler")
            .replace("{avatar}", customerAvatar);
        } else {
          template = template
            .replace("{text}", "Cancel")
            .replace("{avatar}", customerAvatar);
        }

        chatRecord += template;
        jQuery("#chat-list").html(chatRecord);
        scrollToEnd();
      }
      const residenceStr = sessionStorage.getItem("residence-str")
        ? sessionStorage.getItem("residence-str") +
          ",residence-0-" +
          timestamp +
          ", residence-1-" +
          timestamp
        : "residence-0-" + timestamp + ",residence-1-" + timestamp;
      sessionStorage.setItem("residence-str", residenceStr);
    }
    let sessionId = sessionStorage.getItem("session");
    if (inputText) {
      let customerTemplate =
        "<div class='customer-group' id={index}><div class=customer-avatar>{avatar}</div><div class='customer-text'>{text}</div></div>";
      if (intent !== "addr") {
        customerTemplate = customerTemplate
          .replace("{text}", inputText)
          .replace("{avatar}", customerAvatar);
        chatRecord += customerTemplate;
        jQuery("#chat-list").html(chatRecord);
        jQuery("#chat-send-input").val("");
        scrollToEnd();
      }

      const ip =
        jQuery("#gmw-current-location-wrapper-1130 div span").text() +
        "," +
        jQuery("#gmw-current-location-wrapper-1131 div span").text() +
        "," +
        jQuery("#gmw-current-location-wrapper-1132 div span").text();
      const data = {
        user_input: inputText,
        intent_check: isIntent,
        lang: language,
        confirmed_address: intent === "addr" && inputText !== "NO",
        // 				'ip-location': ip
      };

      if (sessionId && sessionId !== "null") {
        data["session_key"] = sessionId;
      } else {
        let url = window.location.href;
        if (url.includes("no=")) {
          let tno = url.split("no=")[1];
          if (tno.includes("&")) {
            const tnoArr = tno.split("&");
            tno = tnoArr[0];
          }
          if (tno.includes(",")) {
