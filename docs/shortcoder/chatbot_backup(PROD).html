<div id="chat-content">
  <div class="chat-group" id="chat-list"></div>
  <div class="chat-input-group">

      <input class="chat-input" id="chat-send-input" />
      <button
        class="chat-button"
        id="chat-send-button"
        onclick="handleSend(true)"
      >
        Send
      </button>
    </div>
    <div
      class="chat-input-group-inner"
      id="chat-input-group-inner-disabled"
      style="flex-direction: column"
    >
      <div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <div>
            <div style="font-weight: 500">Street Number</div>
            <input class="chat-input-disabled" id="chat-input-street-number" />
          </div>
          <div>
            <div style="font-weight: 500">Street Name</div>
            <input class="chat-input-disabled" id="chat-input-street-name" />
          </div>
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <div>
            <div style="font-weight: 500">City</div>
            <input class="chat-input-disabled" id="chat-input-city" />
          </div>
          <div>
            <div style="font-weight: 500">State/Province</div>
            <input class="chat-input-disabled" id="chat-input-state" />
          </div>
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "

          <div>
            <div style="font-weight: 500">Zip/Postal Code</div>
            <input class="chat-input-disabled" id="chat-input-zip" />
          </div>
          <div>
            <div style="font-weight: 500">Country</div>
            <input class="chat-input-disabled" id="chat-input-country" />
          </div>
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <div>
            <div style="font-weight: 500">Unit Number</div>
            <input class="chat-input-disabled" id="chat-input-unit-number" />
          </div>
          <div>

        </div>

        <button

  function handleSend(isIntent, intent) {
    clearTimeout(timeout);
    let inputText = document.getElementById("chat-send-input").value;
    if (!isIntent) {
      inputText = intent;
    }
    if (intent === "addr") {
      const obj = {
        new_address: {
          street_number: document.getElementById("chat-input-street-number")
            .value,
          street_name: document.getElementById("chat-input-street-name").value,
          city: document.getElementById("chat-input-city").value,
          state_or_province: document.getElementById("chat-input-state").value,
          zip_code: document.getElementById("chat-input-zip").value,
          country: document.getElementById("chat-input-country").value,
          unit_number: document.getElementById("chat-input-unit-number").value,
          buzzer_code: document.getElementById("chat-input-buzzer").value,
          house_type: homeType,
        },
      };
      inputText = JSON.stringify(obj);
      console.log(inputText);
    }

    if (inputText) {
      let customerTemplate =

      customerTemplate = customerTemplate
        .replace("{text}", inputText)
        .replace("{avatar}", customerAvatar);

      jQuery("#chat-list").html(chatRecord);
      jQuery("#chat-send-input").val("");
      scrollToEnd();

        intent_check: isIntent,
        // 				French

        lang: "en",

      }

        .replace("{loadingDot}", loadingDot);
      var chatRecordCurr = chatRecord;

      jQuery("#chat-list").html(chatRecordCurr);
      scrollToEnd();

      jQuery.ajax({

              clearHistory(true, "timeout");
            }, validDuration);
            if (response?.context?.request_address) {
              handleUpdateAddress();
            }

  async function startChat(showHistory, isOutputEmpty) {
    try {
      // 			French
      // 			if(window.location.href.includes('fr')) {
      // 				jQuery('#greet-title-content-id').html('Service Client')
      // 			}

      await jQuery("#chat-content").show();

      let recordCompressed = await sessionStorage.getItem("record");
      let record = await LZString.decompress(recordCompressed);
      if (record && !showHistory) {
        // Open new tag or refresh while session not ends
        chatRecord = await record;
        sessionId = (await sessionStorage.getItem("session")) || "";
      } else {
        // Session end and new session starts
        await sessionStorage.setItem("session", "");
        if (record) {
          chatRecord = await record;
        } else {
          // Initial session
          let link =
            "https://chatbot-api.uniuni.ca/unilab/api/index?n_day=1&lang=en";
          let salutText =
            "Hi! I\'m UniUni\'s virtual assistant. What can I help you with today?";
          // 					French
          // 					if(window.location.href.includes('fr')) {
          // 						link = 'https://chatbot-api.qa.uniuni.ca/unilab/api/index?lang=fr&top_n=5&n_day=1';
          // 						salutText = "Salutations! Je suis l\'Assistant Virtuel du Support UniUni. Avez-vous besoin d\'aide avec les services de livraison UniUni ? Je suis votre service et vous aider!";
          // 					}
          var botTemplate =
            "<div class='bot-group'><div class=bot-avatar>{avatar}</div><div class='bot-text'>{text}{label_list}</div></div>";
          botTemplate = await botTemplate
            .replace("{avatar}", botAvatar)
            .replace("{text}", salutText);
          await jQuery.ajax({
            type: "GET",
            dataType: "json",
            headers: {
              "CHATBOT-API-KEY": "uni_lab_pjt02_00001",
              "CONTENT-TYPE": "application/json",
            },
            url: link,
            success: function (response) {
              let groupTemplate = '<div class="label-group-class">{list}</div>';
              let groupTemplateInner = "";
              labelLength = response?.label_list.length || 0;
              if (labelLength > 0) {
                let othersTemplate =
                  '<button class="label-class" value="Others" onclick="handleIntent({index});" id="label-{index}">Others</button>';
                for (let i = 0; i < response.label_list.length; i++) {
                  let template =
                    '<button class="label-class" value="{value}" onclick="handleIntent({index});" id="label-{index}">{label}</button>';
                  template = template
                    .replace("{label}", response.label_list[i])
                    .replace("{index}", i)
                    .replace("{index}", i)
                    .replace("{value}", response.label_list[i]);
                  groupTemplateInner += template;
                }
                othersTemplate = othersTemplate
                  .replace("{index}", labelLength)
                  .replace("{index}", labelLength);
                groupTemplateInner += othersTemplate;
              }
              groupTemplate = groupTemplate.replace(
                "{list}",
                groupTemplateInner,
              );
              botTemplate = botTemplate.replace("{label_list}", groupTemplate);
              chatRecord = botTemplate;
            },
            error: function (err) {
              botTemplate = botTemplate.replace("{label_list}", "");
              chatRecord = botTemplate;
            },
          });
        }
      }
      recordCompressed = await LZString.compress(chatRecord);
      await sessionStorage.setItem("record", recordCompressed);
      await jQuery("#chat-list").html(chatRecord);
      await scrollToEnd();
    } catch {
    } finally {
    }
  }

  function close() {
    var esc = jQuery.Event("keyup");
    esc.keyCode = 27;
    jQuery("#close-button").trigger(esc);
  }

  function clearHistory(showHistory, type, isOutputEmpty) {
    var endTemplate =
      "<div class='bot-group'><div class=bot-avatar>{avatar}</div><div class='bot-text'>{text}</div></div>";
    if (type === "api" && isOutputEmpty) {
      endTemplate = endTemplate
        .replace("{avatar}", botAvatar)
        .replace(
          "{text}",
          "If you have other questions, please rephrase your question to 'Where is my parcel?' or 'When can I expect to receive my parcel?'",
        );
    } else if (type === "api") {
      endTemplate = endTemplate
        .replace("{avatar}", botAvatar)
        .replace(
          "{text}",
          "Thank you for using Uni-Chatbot! Your feedback is valuable in helping us enhance our services. Have a great day.",
        );
      endTemplate += endDivider;
    } else {
      endTemplate = endTemplate
        .replace("{avatar}", botAvatar)
        .replace(
          "{text}",
          "It appears there hasn't been a response for some time. For additional assistance, please feel free to initiate a new chat. Thank you for reaching out.",
        );
      endTemplate += endDivider;
    }

    chatRecord += endTemplate;
    const recordCompressed = LZString.compress(chatRecord);
    sessionStorage.setItem("record", recordCompressed);
    jQuery("#chat-list").html(chatRecord);

    setTimeout(() => {
      scrollToEnd();
    }, 500);
    setTimeout(() => {
      startChat(showHistory, isOutputEmpty);
    }, 3500);
  }

    let customerTemplate =

    handleResidenceSelected(residenceType);
    if (residenceType === 0) {
      customerTemplate = customerTemplate

        .replace("{text}", "house");
    } else {
      customerTemplate = customerTemplate

        .replace("{text}", "townhouse/apartment");
    }
    chatRecord += customerTemplate;
    jQuery("#chat-list").html(chatRecord);

    scrollToEnd();
